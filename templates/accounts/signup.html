{% load static %}

<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
    <head>
        <title>Sign up - Spindle</title>
        <link rel="icon" href="{% static 'img/spindle_mark.svg' %}" type="image/svg+xml">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="{% static 'css/tokens.css' %}">
        <link rel="stylesheet" href="{% static 'css/signup.css' %}">
        <link rel="stylesheet" href="{% static 'css/auth.css' %}">
    </head>

    <body>
        <div id="main-container">
            <a href="{% url 'login' %}"><img src="{% static 'img/spindle_mark.svg' %}" id="logo" alt="Spindle"></a>

            <h2 class="text-white">Sign up to start listening</h2>

            <hr class="solid">

            <div>
                <form action="{% url 'sign_up' %}" method="post">
                    {% csrf_token %}
                    <!-- <label for="email" class="text-white fw-bold">Email address</label> -->
                    <span class="text-white fw-bold">Email address</span>
                    <br>
                    <input type="text" name="email" placeholder="name@domain.com" autocomplete="email" required>

                    <div id="error-message">
                        <br>
                        {% include "partials/_messages.html" %}
                    </div>

                    <br> <br>

                    <input type="submit" value="Next" class="fw-bold">
                </form>
            </div>

            <br><br>

            <div id="sub-container">
                <span class="text-white-50">Already have an account?</span>
                <a href="{% url 'login' %}" class="text-white">Log in here</a>.
            </div>
        </div>
    </body>
</html>
