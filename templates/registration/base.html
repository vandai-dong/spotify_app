{% load static %}<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Reset password - Spotify{% endblock %}</title>
    <link rel="icon" href="{% static 'img/spindle_mark.svg' %}" type="image/svg+xml">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="{% static 'css/tokens.css' %}">
        <link rel="stylesheet" href="{% static 'css/login.css' %}">
        <link rel="stylesheet" href="{% static 'css/auth.css' %}">
  </head>
  <body>
    <div id="main-container">
      <a href="{% url 'login' %}"><img src="{% static 'img/spindle_mark.svg' %}" id="logo" alt="Spindle" /></a>
      {% block content %}{% endblock %}
      <br /><br />
      <div id="sub-container"><a href="{% url 'login' %}" class="text-white">Back to log in</a></div>
    </div>
  </body>
</html>
