{% load static %}<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Reset password - Spotify{% endblock %}</title>
    <link rel="icon" href="https://accounts.scdn.co/sso/images/favicon.ace4d8543bbb017893402a1e9d1ac1fa.ico" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="{% static 'css/login.css' %}" />
  </head>
  <body>
    <div id="main-container">
      <a href="{% url 'login' %}"><img src="{% static 'img/spotify_logo.jpg' %}" id="logo" alt="Spotify Logo" /></a>
      {% block content %}{% endblock %}
      <br /><br />
      <div id="sub-container"><a href="{% url 'login' %}" class="text-white">Back to log in</a></div>
    </div>
  </body>
</html>
