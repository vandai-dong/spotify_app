{% extends "registration/base.html" %}
{% block content %}
<h2 class="text-white">Reset your password</h2>
<div class="text-white" style="width: 50%">Enter the email address linked to your account and we'll send you a link to choose a new password.</div>
<br />
{% for error in form.email.errors %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endfor %}
<form method="post">
  {% csrf_token %}
  <span class="text-white fw-bold">Email address</span><br />
  <input type="text" name="email" autocomplete="email" required /><br /><br />
  <input type="submit" value="Send reset link" class="fw-bold" />
</form>
{% endblock %}
